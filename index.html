<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <!--
      ホーム画面に追加すると全画面で開く（2026-07-26）。
      🔑 スマホのブラウザは上下バーが画面の約1/4を占めていて、ページ側からは消せない。
         盤面が小さいのはこれが主因なので、消したければホーム追加してもらうしかない。
      ⚠️ `black-translucent` はステータスバーの下まで描く指定。`viewport-fit=cover` と
         セットで効き、HUDは `env(safe-area-inset-*)` で内側に寄せてある。
    -->
    <!--
      ⚠️ **パスは必ず `/` から書く**（2026-07-26 れいあのiPhoneでアイコンが「M」になった）。
         Vite が base（/bounce-collect/）を足すのは**`/`始まりだけ**で、`assets/…` のような
         相対のままだと iOS がホーム画面のアイコンとして拾ってくれなかった。
         画像自体は正常（180×180・8bit RGB）で、favicon だけ効いていたのが手がかり。
      ⚠️ iOSは**追加した時点のアイコンを焼き付ける**。直したら一度ホーム画面から消して追加し直す。
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Marble Mill" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#170e09" />
    <title>Marble Mill</title>
    <style>
      /* 木のおもちゃ工房テイスト。アクセントは真鍮（バケツのたが・仕切りと同色） */
      :root {
        --outer: #170e09;
        --ink: #fdf6ec;
        --sub: #c0ac93;
        --accent: #e6b862;
        --accent-ink: #2e1e05;
        --panel: #1d1610;
        --panel-line: rgba(255, 238, 214, 0.12);

        /* ── 質感の共通ルール（2026-07-27・PLAYボタンで確定した案Aを全UIへ展開）──
           🔑 **影の値をベタ書きで散らさない**。ここを直せば全画面の質感が同時に動く。
              散らすと「ボタンだけ古い質感が残る」形で必ず崩れる。
           使い分け:
             主ボタン（押して進む）      = --brass-face + --lift / :active で --lift-down
             副ボタン（戻る・キャンセル）= --dark-face  + --lift-dark / --lift-dark-down
             パネル・カード（押さない）  = --dark-face  + --panel-lift
           ⚠️ 厚み（`0 Npx 0`）と沈み量（translateY）は**必ずセット**で直す。
              片方だけ変えるとボタンが床に埋まる／浮いて見える。 */
        --brass-face: linear-gradient(180deg, #f7d99b 0%, #e6b862 44%, #c8943d 100%);
        --brass-edge: #8a6524;
        --dark-face: linear-gradient(180deg, rgba(38, 26, 15, 0.72), rgba(20, 12, 6, 0.62));
        --dark-edge: #2a1c0c;
        --brass-line: rgba(230, 184, 98, 0.28);
        /* 主ボタン: 厚み6px */
        --lift:
          inset 0 2px 0 rgba(255, 255, 255, 0.6), inset 0 -2px 0 rgba(0, 0, 0, 0.2),
          0 6px 0 var(--brass-edge), 0 16px 30px rgba(0, 0, 0, 0.45);
        --lift-down:
          inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.2),
          0 1px 0 var(--brass-edge), 0 5px 14px rgba(0, 0, 0, 0.4);
        /* 副ボタン: 厚み4px */
        --lift-dark:
          inset 0 1px 0 rgba(255, 238, 214, 0.14),
          0 4px 0 var(--dark-edge), 0 12px 22px rgba(0, 0, 0, 0.4);
        --lift-dark-down:
          inset 0 1px 0 rgba(255, 238, 214, 0.12),
          0 1px 0 var(--dark-edge), 0 5px 12px rgba(0, 0, 0, 0.36);
        /* 押さないパネル: 厚みは付けず、内側の光と落ち影だけ */
        --panel-lift: inset 0 1px 0 rgba(255, 238, 214, 0.1), 0 10px 24px rgba(0, 0, 0, 0.35);
        --press: transform 70ms ease, box-shadow 70ms ease;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--outer);
        color: var(--ink);
        font: 15px/1.6 "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      /* 盤面はフルスクリーン（旧: 上74px/下86pxの固定バーは撤去） */
      #stage {
        position: fixed;
        inset: 0;
        touch-action: none; /* ドラッグでページが動かないように */
      }

      /* ── プレイ中のオーバーレイHUD ── */
      #hud {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: calc(14px + env(safe-area-inset-top, 0)) 18px 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        pointer-events: none;
      }
      .score-wrap { text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85); }
      .score-label {
        font: 700 11px/1 inherit;
        letter-spacing: 0.22em;
        color: var(--sub);
      }
      #score {
        font: 800 44px/1 ui-rounded, "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
        color: var(--ink);
        margin-top: 4px;
      }
      #hint {
        font: 600 12px/1.4 inherit;
        color: var(--sub);
        margin-top: 6px;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
      }
      .icon-col {
        display: flex;
        flex-direction: row;
        gap: 10px;
        pointer-events: auto;
      }
      /* HUDの丸ボタンもPLAYと同じ作法（暗い面＋真鍮の縁＋厚み4px＋押すと沈む）。
         ⚠️ backdrop-filter は残す＝盤面の絵の上に浮くので、透けないと重く見える。 */
      .icon-btn {
        width: 54px; height: 54px;
        border-radius: 50%;
        border: 1px solid var(--brass-line);
        background: var(--dark-face);
        backdrop-filter: blur(10px);
        color: var(--ink);
        font: 800 19px/1 ui-rounded, system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        box-shadow: var(--lift-dark);
        transition: var(--press);
      }
      /* 速さボタンだけ真鍮の面（いま効いている設定＝主役のボタン） */
      .icon-btn.hot {
        background: var(--brass-face); color: var(--accent-ink); border-color: transparent;
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.55), inset 0 -2px 0 rgba(0, 0, 0, 0.18),
          0 4px 0 var(--brass-edge), 0 12px 22px rgba(0, 0, 0, 0.4);
      }
      .icon-btn:active { transform: translateY(3px); box-shadow: var(--lift-dark-down); }
      .icon-btn.hot:active {
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.18),
          0 1px 0 var(--brass-edge), 0 5px 12px rgba(0, 0, 0, 0.36);
      }
      .icon-btn svg { width: 24px; height: 24px; }
      /* 🔴 `hidden` 属性だけでは消えない（上の display:flex が勝つ）。
         このファイルで同じ罠を何度も踏んでいるので、display を持つ物には必ず対で書く。 */
      .icon-btn[hidden] { display: none; }
      /* 工房への入口。⚠️ R1の投下前だけ出るボタンなので、他のボタンと同じ列に置くと
         出たり消えたりで隣のボタンの位置が動く（指が覚えた場所が壊れる）。
         だから盤面の**右下に独立して**浮かせる（2026-07-27 れいあ要望）。 */
      #workshop-fab {
        position: fixed;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 4px;
        width: 82px; height: 82px; border-radius: 24px;
        border: 1.5px solid var(--accent);
        background: var(--dark-face);
        backdrop-filter: blur(10px);
        color: var(--accent);
        font: 800 13px/1 inherit; letter-spacing: 0.06em;
        cursor: pointer;
        box-shadow: var(--lift-dark);
        transition: var(--press);
      }
      #workshop-fab[hidden] { display: none; }
      #workshop-fab svg { width: 30px; height: 30px; }
      #workshop-fab:active { transform: translateY(3px); box-shadow: var(--lift-dark-down); }
      /* 音のオン/オフで波線と×を入れ替える（アイコンを2つ持たない） */
      #sound .snd-off { display: none; }
      #sound[data-muted='true'] .snd-on { display: none; }
      #sound[data-muted='true'] .snd-off { display: inline; }

      /* 音量パネル（音アイコンを押すと出る）。⚠️ 0 まで下げるとミュート */
      .sound-wrap { position: relative; }
      #sound-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 8;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(12, 14, 18, 0.94);
        border: 2px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #sound-panel[hidden] { display: none; }
      /* ⚠️ 指で掴める大きさにする（低視力・タッチ配慮） */
      #sound-panel input[type='range'] {
        width: 150px;
        height: 28px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      #volume-val {
        min-width: 2.6em;
        text-align: right;
        font: 700 16px/1 system-ui, sans-serif;
        color: var(--ink);
      }

      /* デバッグ表示（?debug=1 の時だけ） */
      #debug {
        position: fixed;
        left: 0; right: 0;
        bottom: calc(6px + env(safe-area-inset-bottom, 0));
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.72);
        color: #9ff5c8;
        font: 600 11px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
        white-space: pre-line;
        text-align: center;
        pointer-events: none;
        z-index: 5;
      }
      #debug[hidden] { display: none; }

      /* 盛り上がりの実験プリセット（?debug=1 の時だけ）。⚠️ 選定が終わったら消す */
      #supply-switch {
        position: fixed;
        left: 0; right: 0;
        bottom: calc(62px + env(safe-area-inset-bottom, 0));
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        align-items: center;
        /* ⚠️ タイトル等のオーバーレイ（.screen = 10）**より上**に出すこと。
           6 に置いていた時はタイトル画面の膜がクリックを吸って**押せなかった**（実機で判明）。 */
        z-index: 20;
      }
      #supply-switch[hidden] { display: none; }
      #supply-switch .supply-label,
      #supply-switch .supply-hint {
        color: #cfe6dd;
        font: 700 14px/1.4 system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.72);
        padding: 4px 8px;
        border-radius: 6px;
      }
      #supply-switch button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 2px solid rgba(255, 255, 255, 0.28);
        background: rgba(0, 0, 0, 0.78);
        color: #eaf6f1;
        font: 700 16px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      #supply-switch button[aria-pressed='true'] {
        border-color: #ffd85e;
        color: #ffd85e;
      }
      /* ⚠️ HUDはプレイ中だけ出す（読み込み中の黒画面に浮くのを防ぐ） */
      #hud[hidden] { display: none; }

      /* 読み込みの進み具合。工房のバーと同じ見た目に揃える */
      .load-bar {
        width: 62%; height: 8px; margin: 4px auto 0;
        border-radius: 6px; background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--panel-line); overflow: hidden;
      }
      .load-bar i {
        display: block; height: 100%; width: 0; border-radius: 6px;
        background: linear-gradient(90deg, var(--brass-edge), var(--accent));
        transition: width 0.2s ease-out;
      }

      /*
        横向きの案内（2026-07-26）。
        ⚠️ 盤面は縦長（360×720）なので、横向きだと細い帯になってボタンや文字が盤面に重なる。
           作り替えるとステージ9型を全部やり直すことになるので、**縦持ちに戻してもらう**方を採る。
        ⚠️ 出す条件を「横向き」だけにしないこと。PCの横長ウィンドウでも出てしまう。
           高さで絞る（スマホ横向き=393px前後 / ノートPC=600px以上）。
      */
      #rotate-hint { display: none; }
      @media (orientation: landscape) and (max-height: 500px) {
        #rotate-hint {
          position: fixed;
          inset: 0;
          z-index: 100;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: var(--outer);
          text-align: center;
          padding: 20px;
        }
        #rotate-hint svg { width: 54px; height: 54px; color: var(--accent); }
        #rotate-hint .rh-t { font: 800 19px/1.4 inherit; color: var(--ink); }
        #rotate-hint .rh-s { font: 600 13px/1.6 inherit; color: var(--sub); }
      }

      /* ── オーバーレイ画面の共通枠 ── */
      .screen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .screen[hidden] { display: none; }
      .screen .backdrop { position: absolute; inset: 0; background: rgba(12, 7, 3, 0.72); backdrop-filter: blur(6px); }

      /* ── カード（ダイアログ・リザルト共通） ── */
      /* ⚠️ カードの面は**不透明**のまま（半透明の --dark-face を使わない）。
         リザルトやダイアログは背景の盤面が透けると文字が読みにくくなる。
         質感の足し方だけ他と揃える＝上に光の線・真鍮寄りの枠・落ち影。 */
      .card {
        position: relative;
        width: 100%; max-width: 420px;
        background: linear-gradient(180deg, #251b12 0%, #191209 100%);
        border: 1px solid var(--brass-line);
        border-radius: 22px;
        padding: 28px 24px 22px;
        text-align: center;
        box-shadow: var(--panel-lift), 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .card h2 { font: 800 21px/1.4 inherit; color: var(--ink); margin-bottom: 8px; }
      .card p { font-size: 14px; color: var(--sub); margin-bottom: 22px; }
      .row { display: flex; gap: 10px; }
      /* 主ボタン（もう一回・やり直す）＝PLAYと同じ真鍮の銘板。厚みだけ4pxで小ぶりにする
         （PLAYが主役なので、同じ6pxにすると格が並んでしまう）。 */
      .btn {
        flex: 1; min-height: 54px;
        border: 0; border-radius: 14px;
        font: 800 16px/1 inherit; cursor: pointer;
        background: var(--brass-face); color: var(--accent-ink);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.55), inset 0 -2px 0 rgba(0, 0, 0, 0.18),
          0 4px 0 var(--brass-edge), 0 12px 22px rgba(0, 0, 0, 0.4);
        transition: var(--press);
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.18),
          0 1px 0 var(--brass-edge), 0 5px 12px rgba(0, 0, 0, 0.36);
      }
      /* 副ボタン（タイトルへ・つづける・リセット）＝暗い面＋真鍮の縁。押すと同じように沈む
         ⚠️ 透明のままにすると、隣の主ボタンだけ立体で「並んでいない」感じになる。 */
      .btn.ghost {
        background: var(--dark-face); color: var(--ink);
        border: 1px solid var(--brass-line);
        box-shadow: var(--lift-dark);
      }
      .btn.ghost:active { transform: translateY(3px); box-shadow: var(--lift-dark-down); }

      .res-label { font: 700 11px/1 inherit; letter-spacing: 0.22em; color: var(--sub); }
      #result-score {
        font: 800 60px/1 ui-rounded, system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em; color: var(--accent);
        margin: 8px 0 4px;
      }
      /* NEW RECORD の札。厚みは2pxだけ（小さいので4pxだと下の縁が目立ちすぎる） */
      .badge {
        display: inline-block;
        font: 800 12px/1 inherit; letter-spacing: 0.14em;
        background: var(--brass-face); color: var(--accent-ink);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        padding: 7px 12px; border-radius: 999px; margin-bottom: 18px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          0 2px 0 var(--brass-edge), 0 6px 14px rgba(0, 0, 0, 0.35);
      }
      .badge[hidden] { display: none; }

      /* ── ランキング表 ── */
      .rank-list { text-align: left; }
      .rank-row {
        display: flex; align-items: baseline; gap: 10px;
        padding: 9px 4px; border-bottom: 1px solid var(--panel-line);
        font-variant-numeric: tabular-nums;
      }
      .rank-row:last-child { border-bottom: 0; }
      .rank-row .no { width: 24px; font: 800 14px/1 inherit; color: var(--sub); }
      .rank-row .v { flex: 1; font: 800 19px/1 inherit; color: var(--ink); }
      .rank-row .d { font: 400 12px/1 inherit; color: var(--sub); }
      .rank-row.me .v, .rank-row.me .no { color: var(--accent); }
      /* 工房：未解放は沈めて、解放済みとの差を一目で出す */
      .rank-row.locked .v, .rank-row.locked .no { opacity: .38; }
      .rank-row.locked .d { opacity: .55; }
      /* ── 工房 ── */
      .ws-top { padding: 10px 2px 14px; border-bottom: 1px solid var(--panel-line); margin-bottom: 14px; }
      .ws-total { display: flex; align-items: baseline; gap: 10px; }
      .ws-total .ws-k { font: 700 12px/1 inherit; color: var(--sub); letter-spacing: .1em; }
      .ws-total .ws-v { font: 800 34px/1 inherit; color: var(--accent); font-variant-numeric: tabular-nums; }
      .ws-next { font: 600 14px/1.5 inherit; color: var(--ink); margin-top: 10px; }
      .ws-next b { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 17px; }
      /* 次の解放までのバー。数字より「あとどれくらい」が一目で分かる */
      .ws-bar { height: 10px; border-radius: 6px; background: rgba(0,0,0,.4);
        border: 1px solid var(--panel-line); overflow: hidden; margin-top: 8px; }
      .ws-bar i { display: block; height: 100%; border-radius: 6px;
        background: linear-gradient(90deg, #8a6420, var(--accent)); }
      .ws-prog { font: 700 12px/1 inherit; color: var(--sub); margin-top: 9px; letter-spacing: .08em; }

      .ws-list { display: block; }
      .ws-sec { margin-bottom: 20px; }
      .ws-sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 10px;
        font: 800 15px/1 inherit; color: var(--ink); }
      .ws-sec-h span { font: 600 11px/1 inherit; color: var(--sub); letter-spacing: .06em; }
      .ws-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 12px; }
      /* ⚠️ 工房のカードは25枚前後並ぶので、影は**軽く**する（PLAYと同じ厚みを付けると画面が重い）。
         統一のために「上の光の線」だけは他と同じ作法で入れてある。 */
      .ws-card { display: flex; flex-direction: column; gap: 9px; align-items: center;
        padding: 14px 10px 12px; border-radius: 14px; text-align: center;
        border: 1px solid var(--panel-line); background: var(--dark-face);
        box-shadow: inset 0 1px 0 rgba(255,238,214,.06), 0 4px 12px rgba(0,0,0,.3);
        transition: var(--press); }
      .ws-card.got { border-color: var(--brass-line);
        background: linear-gradient(180deg, rgba(64,44,16,.62), rgba(34,24,10,.55));
        box-shadow: inset 0 1px 0 rgba(255,238,214,.12), 0 6px 16px rgba(0,0,0,.34); }
      .ws-card.pick:active { transform: translateY(2px); }
      .ws-card .ws-name { font: 800 14px/1.35 inherit; color: var(--ink); }
      .ws-card .ws-cost { font: 700 12px/1 inherit; color: var(--sub); font-variant-numeric: tabular-nums; }
      .ws-card.got .ws-cost { color: var(--accent); }
      .ws-card.lock { opacity: .5; }
      /* 選べるカードは押せると分かるように。選択中は金の縁を太くして帯を出す */
      .ws-card.pick { cursor: pointer; }
      .ws-card.pick:hover { border-color: rgba(232,193,101,.8); }
      .ws-card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(232,193,101,.35); }
      .ws-card.sel .ws-cost { color: var(--accent); font-weight: 800; }
      .ws-card.sel::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 6px;
        height: 3px; border-radius: 2px; background: var(--accent); }
      .ws-card { position: relative; }
      /* プレビュー: 実物の見た目をそのまま出す（この画面の主役） */
      .ws-pv { width: 62px; height: 62px; border-radius: 12px; display: grid; place-items: center;
        background: rgba(0,0,0,.35); border: 1px solid var(--panel-line); overflow: hidden; }
      .ws-pv.board { background-size: cover; background-position: center; }
      .ws-pv .ball { width: 40px; height: 40px; border-radius: 50%;
        box-shadow: 2px 3px 6px rgba(0,0,0,.45); }
      .ws-pv svg { display: block; }
      .ws-foot { margin: 18px 2px 6px; display: flex; justify-content: center; }
      .ws-foot .btn { font-size: 13px; padding: 10px 16px; }
      .rank-empty { padding: 16px 4px; color: var(--sub); font-size: 13px; text-align: center; }

      /* ── タイトル画面 ── */
      #screen-title .backdrop {
        background:
          linear-gradient(rgba(18, 10, 4, 0.58), rgba(18, 10, 4, 0.58)),
          url(assets/title-bg.jpg) center / cover no-repeat;
      }
      .title-screen {
        position: relative;
        width: 100%; max-width: 420px;
        display: flex; flex-direction: column; align-items: center;
        padding: 0 6px;
      }
      .logo { text-align: center; margin-bottom: 32px; }
      .logo .l1 {
        font: 800 44px/1.05 ui-rounded, system-ui, sans-serif;
        letter-spacing: 0.1em; text-indent: 0.1em; color: var(--ink);
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
      }
      /* MILL だけ真鍮に光沢を入れる（PLAYボタンの質感と揃える・2026-07-27）。
         ⚠️ `color` を先に置いてから `-webkit-text-fill-color` で抜く順番を守る。
            逆にすると背景クリップが効かない環境で**文字が消える**。 */
      .logo .l2 {
        font: 800 44px/1.05 ui-rounded, system-ui, sans-serif;
        letter-spacing: 0.1em; text-indent: 0.1em; color: var(--accent);
        background: linear-gradient(180deg, #fbe6b8 0%, #e6b862 50%, #b9852f 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.55));
      }
      .logo .rule {
        width: 76%; height: 1px; margin: 16px auto 11px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0.75;
      }
      .logo .sub { font: 600 12px/1 inherit; letter-spacing: 0.34em; text-indent: 0.34em; color: var(--sub); }
      /* 真鍮の銘板（2026-07-27 れいあが4案から選択＝案A）。
         🔑 立体に見えているのは **`0 6px 0` の下面**（厚み）＋内側の上下の光と陰。
            押した時は translateY で沈めて、同じ量だけ厚みを削る（下面が床に着く動き）。
         ⚠️ 厚みと沈み量は必ずセットで直す（片方だけ変えるとボタンが床に埋まる/浮く）。
         元の姿＝`background: var(--accent)` のベタ塗り＋落ち影だけ（押しても沈まなかった）。 */
      .play-btn {
        width: 100%; min-height: 68px;
        border: 0; border-radius: 18px;
        background: var(--brass-face); color: var(--accent-ink);
        font: 800 22px/1 inherit; letter-spacing: 0.1em; cursor: pointer;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
        box-shadow: var(--lift);
        transition: var(--press);
      }
      .play-btn:active { transform: translateY(5px); box-shadow: var(--lift-down); }
      /* ボタンだけ質感を上げると浮くので、枠にも内側の光と落ち影を入れて同じ分だけ持ち上げる
         （2026-07-27・モックでれいあ承認）。⚠️ 文字の大きさと配置は変えない＝読みやすさを崩さない。 */
      .hs-panel {
        width: 100%; margin-top: 26px;
        background: var(--dark-face);
        border: 1px solid var(--brass-line); border-radius: 18px;
        padding: 16px 18px; cursor: pointer;
        box-shadow: var(--panel-lift);
        transition: var(--press);
      }
      .hs-panel:active { transform: translateY(2px); }
      .hs-panel .t {
        display: flex; align-items: baseline; justify-content: space-between;
        font: 700 11px/1 inherit; letter-spacing: 0.22em; color: var(--sub); margin-bottom: 6px;
      }
      .hs-panel .more { font: 700 12px/1 inherit; letter-spacing: 0; color: var(--accent); }
      /* ⚠️ ここは情報行なので**控えめに**。薄い枠と面だけ足して「押せる」と分かる程度に留める
         （PLAYと同じ厚みを付けると主役が3つになって画面が散る）。 */
      .total-line {
        width: 100%; margin-top: 12px;
        display: flex; align-items: center; gap: 10px;
        background: rgba(20, 12, 6, 0.38); border: 1px solid var(--panel-line);
        border-radius: 12px; cursor: pointer;
        color: var(--sub); font: 700 12px/1 inherit; letter-spacing: 0.14em;
        padding: 12px 12px;
        transition: var(--press);
      }
      .total-line:hover { border-color: var(--brass-line); }
      .total-line .tl-val {
        color: var(--ink); font-size: 15px; letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }
      .total-line .tl-rank { margin-left: auto; color: var(--accent); letter-spacing: 0.06em; }
      .total-line:active { opacity: 0.7; }

      /* リザルトの添えトータル1行 */
      .result-total {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        margin: 16px 0 2px; font: 700 12px/1 inherit; letter-spacing: 0.1em; color: var(--sub);
      }
      .result-total .rt-val { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
      .result-total .rt-rank { color: var(--accent); }

      .title-foot { margin-top: 22px; }
      /* 工房 / ステージエディタ ＝副ボタンの作法（暗い面＋真鍮の縁＋厚み4px） */
      .title-foot button {
        font: 700 14px/1 inherit; letter-spacing: 0.06em; color: var(--ink);
        border: 1px solid var(--brass-line); border-radius: 999px;
        padding: 13px 22px; background: var(--dark-face); cursor: pointer;
        box-shadow: var(--lift-dark);
        transition: var(--press);
      }
      .title-foot button:active { transform: translateY(3px); box-shadow: var(--lift-dark-down); }

      /* ── ハイスコア一覧 ── */
      #screen-scores { padding: 0; }
      #screen-scores .backdrop { background: rgba(12, 7, 3, 0.9); }
      .sheet {
        position: relative;
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        padding: calc(20px + env(safe-area-inset-top, 0)) 22px calc(24px + env(safe-area-inset-bottom, 0));
        max-width: 520px; margin: 0 auto;
      }
      .sheet .head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      /* ⚠️ スマホで「‹」が見えにくいと指摘（2026-07-27 れいあ）。
         🔴 1回目は「54pxに拡大＋真鍮色」で直したが、れいあの判定は**「変わった気がしなかった」**。
            ＝問題は大きさではなく**記号1文字では何のボタンか分からない**こと。
            だから丸ボタンをやめて「戻る」の文字を入れた横長ボタンにしてある。
            教訓＝視認性の指摘に対して寸法だけ足しても伝わらない。 */
      .sheet .head .back {
        height: 50px; padding: 0 18px 0 13px; border-radius: 25px;
        border: 1.5px solid var(--accent);
        background: rgba(230, 184, 98, 0.16); color: var(--accent);
        font: 800 17px/1 inherit; letter-spacing: 0.04em; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 6px;
        white-space: nowrap;
        box-shadow: var(--lift-dark);
        transition: var(--press);
      }
      .sheet .head .back:active { transform: translateY(3px); box-shadow: var(--lift-dark-down); }
      .sheet .head .back .chev { font-size: 26px; margin-top: -3px; }
      .sheet .head .back:active { background: rgba(230, 184, 98, 0.3); }
      .sheet .head h2 { font: 800 19px/1 inherit; letter-spacing: 0.12em; color: var(--ink); }
      .sheet .body {
        flex: 1; overflow: auto;
        background: var(--dark-face);
        border: 1px solid var(--brass-line); border-radius: 18px;
        padding: 6px 18px;
        box-shadow: var(--panel-lift);
      }
    </style>
  </head>
  <body>
    <!-- 盤面（canvas はここに挿入される） -->
    <div id="stage"></div>

    <!-- プレイ中のHUD（⚠️ 起動時は隠す。読み込み中の黒画面に浮かせない） -->
    <div id="hud" hidden>
      <div class="score-wrap">
        <div class="score-label" id="score-label">SCORE</div>
        <div id="score">0</div>
        <div id="hint">画面をタップすると始まるよ</div>
      </div>
      <div class="icon-col">
        <button id="speed" class="icon-btn hot">1×</button>
        <button id="restart" class="icon-btn" aria-label="やり直す">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" />
          </svg>
        </button>
        <!-- ⚠️ タイトルへ戻る口はここには置かない（リザルトの「タイトルへ」だけ・2026-07-27 れいあ要望）。
             工房の入口は列に混ぜず、盤面の右下（#workshop-fab）に独立して置いている。 -->
        <div class="sound-wrap">
          <button id="sound" class="icon-btn" aria-label="音量" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9.5h3.4L12 5.4v13.2L7.4 14.5H4z" />
              <path class="snd-on" d="M16 9.2a4 4 0 0 1 0 5.6" /><path class="snd-on" d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8" />
              <path class="snd-off" d="M16.4 9.6 21 14.4" /><path class="snd-off" d="M21 9.6 16.4 14.4" />
            </svg>
          </button>
          <!-- 音量パネル。⚠️ 0 まで下げるとミュート（ミュート専用ボタンは持たない） -->
          <div id="sound-panel" hidden>
            <input id="volume" type="range" min="0" max="100" step="5" aria-label="音量" />
            <div id="volume-val">60</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 工房への入口。R1の投下前（まだ玉を落としていない間）だけ盤面の右下に出る。
         位置は layoutHud() が盤面に合わせて置く（画面端でなく盤面の角に付ける）。 -->
    <button id="workshop-fab" aria-label="工房で見た目を変える" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="8.5" cy="8.5" r="3.6" /><circle cx="16" cy="13" r="3.6" /><circle cx="9.5" cy="17" r="2.8" />
      </svg>
      <span>工房</span>
    </button>

    <!-- デバッグ表示（URLに ?debug=1 を付けた時だけ出る） -->
    <div id="debug" hidden></div>
    <!-- 盛り上がりの実験プリセット（?debug=1 の時だけ・中身はJSが組む） -->
    <div id="supply-switch" hidden></div>

    <!-- 横向きの案内（CSSだけで出す＝JSは関与しない） -->
    <div id="rotate-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="2" width="10" height="20" rx="2.2" />
        <path d="M12 18.4h.01" />
        <path d="M2.6 12a9.4 9.4 0 0 1 2.9-6.8" /><path d="M2.4 8.4 2.6 12l3.6-.4" />
      </svg>
      <div class="rh-t">画面を縦にしてね</div>
      <div class="rh-s">盤面が縦長だから、横向きだと遊びにくいんだ</div>
    </div>

    <!-- 読み込み中（⚠️ 画像を1枚も使わない＝これ自体は待ち時間ゼロで出る） -->
    <div class="screen" id="screen-loading">
      <div class="backdrop" style="background: var(--outer); backdrop-filter: none"></div>
      <div class="title-screen">
        <div class="logo">
          <div class="l1">MARBLE</div>
          <div class="l2">MILL</div>
          <div class="rule"></div>
          <div class="sub">LOADING</div>
        </div>
        <div class="load-bar"><i id="load-bar-fill"></i></div>
      </div>
    </div>

    <!-- タイトル画面 -->
    <div class="screen" id="screen-title" hidden>
      <div class="backdrop"></div>
      <div class="title-screen">
        <div class="logo">
          <div class="l1">MARBLE</div>
          <div class="l2">MILL</div>
          <div class="rule"></div>
          <div class="sub">REIA EDITION</div>
        </div>
        <button class="play-btn" id="title-play">PLAY</button>
        <div class="hs-panel" id="title-scores">
          <div class="t">HIGH SCORE<span class="more">すべて見る ›</span></div>
          <div class="rank-list" id="title-hs-list"></div>
        </div>
        <button class="total-line" id="title-total">
          <span class="tl-label">TOTAL</span>
          <span class="tl-val" id="title-total-val">0</span>
          <span class="tl-rank" id="title-total-rank">世界 #—</span>
        </button>
        <div class="title-foot">
          <button id="title-workshop">工房</button>
          <button id="title-editor">ステージ工房</button>
        </div>
      </div>
    </div>

    <!-- リザルト -->
    <div class="screen" id="screen-result" hidden>
      <div class="backdrop"></div>
      <div class="card">
        <div class="res-label">SCORE</div>
        <div id="result-score">0</div>
        <div class="badge" id="result-badge" hidden>NEW RECORD</div>
        <div class="rank-list" id="result-list"></div>
        <div class="result-total">
          <span>TOTAL</span>
          <span class="rt-val" id="result-total-val">0</span>
          <span class="rt-rank" id="result-total-rank">世界 #—</span>
        </div>
        <div class="row" style="margin-top: 16px">
          <button class="btn ghost" id="result-title">タイトルへ</button>
          <button class="btn" id="result-retry">もう一回</button>
        </div>
      </div>
    </div>

    <!-- トータルランキング（疑似・ローカル） -->
    <div class="screen" id="screen-total" hidden>
      <div class="backdrop"></div>
      <div class="sheet">
        <div class="head">
          <button class="back" id="total-back" aria-label="戻る"><span class="chev" aria-hidden="true">‹</span>戻る</button>
          <h2>TOTAL RANKING</h2>
        </div>
        <div class="body"><div class="rank-list" id="total-list"></div></div>
      </div>
    </div>

    <!-- 工房（やればやるだけ解放されていく見た目） -->
    <div class="screen" id="screen-workshop" hidden>
      <div class="backdrop"></div>
      <div class="sheet">
        <div class="head">
          <button class="back" id="workshop-back" aria-label="戻る"><span class="chev" aria-hidden="true">‹</span>戻る</button>
          <h2>WORKSHOP</h2>
        </div>
        <div class="body">
          <div class="ws-top" id="workshop-top"></div>
          <div class="ws-list" id="workshop-list"></div>
          <div class="ws-foot">
            <button class="btn ghost" id="workshop-reset">貯まったビー玉をリセット</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ハイスコア一覧 -->
    <div class="screen" id="screen-scores" hidden>
      <div class="backdrop"></div>
      <div class="sheet">
        <div class="head">
          <button class="back" id="scores-back" aria-label="戻る"><span class="chev" aria-hidden="true">‹</span>戻る</button>
          <h2>HIGH SCORE</h2>
        </div>
        <div class="body"><div class="rank-list" id="scores-list"></div></div>
      </div>
    </div>

    <!-- 確認ダイアログ -->
    <div class="screen" id="dialog" hidden>
      <div class="backdrop"></div>
      <div class="card">
        <h2 class="d-title"></h2>
        <p class="d-body"></p>
        <div class="row">
          <button class="btn ghost d-cancel">つづける</button>
          <button class="btn d-ok">やり直す</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
