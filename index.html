<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#170e09" />
    <title>Marble Mill</title>
    <style>
      /* 木のおもちゃ工房テイスト。アクセントは真鍮（バケツのたが・仕切りと同色） */
      :root {
        --outer: #170e09;
        --ink: #fdf6ec;
        --sub: #c0ac93;
        --accent: #e6b862;
        --accent-ink: #2e1e05;
        --panel: #1d1610;
        --panel-line: rgba(255, 238, 214, 0.12);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--outer);
        color: var(--ink);
        font: 15px/1.6 "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      /* 盤面はフルスクリーン（旧: 上74px/下86pxの固定バーは撤去） */
      #stage {
        position: fixed;
        inset: 0;
        touch-action: none; /* ドラッグでページが動かないように */
      }

      /* ── プレイ中のオーバーレイHUD ── */
      #hud {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: calc(14px + env(safe-area-inset-top, 0)) 18px 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        pointer-events: none;
      }
      .score-wrap { text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85); }
      .score-label {
        font: 700 11px/1 inherit;
        letter-spacing: 0.22em;
        color: var(--sub);
      }
      #score {
        font: 800 44px/1 ui-rounded, "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
        color: var(--ink);
        margin-top: 4px;
      }
      #hint {
        font: 600 12px/1.4 inherit;
        color: var(--sub);
        margin-top: 6px;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
      }
      .icon-col {
        display: flex;
        flex-direction: row;
        gap: 10px;
        pointer-events: auto;
      }
      .icon-btn {
        width: 54px; height: 54px;
        border-radius: 50%;
        border: 1px solid var(--panel-line);
        background: rgba(20, 12, 6, 0.62);
        backdrop-filter: blur(10px);
        color: var(--ink);
        font: 800 19px/1 ui-rounded, system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
      }
      .icon-btn.hot { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
      .icon-btn:active { opacity: 0.8; }
      .icon-btn svg { width: 24px; height: 24px; }

      /* デバッグ表示（?debug=1 の時だけ） */
      #debug {
        position: fixed;
        left: 0; right: 0;
        bottom: calc(6px + env(safe-area-inset-bottom, 0));
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.72);
        color: #9ff5c8;
        font: 600 11px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
        white-space: pre-line;
        text-align: center;
        pointer-events: none;
        z-index: 5;
      }
      #debug[hidden] { display: none; }

      /* ── オーバーレイ画面の共通枠 ── */
      .screen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .screen[hidden] { display: none; }
      .screen .backdrop { position: absolute; inset: 0; background: rgba(12, 7, 3, 0.72); backdrop-filter: blur(6px); }

      /* ── カード（ダイアログ・リザルト共通） ── */
      .card {
        position: relative;
        width: 100%; max-width: 420px;
        background: var(--panel);
        border: 1px solid var(--panel-line);
        border-radius: 22px;
        padding: 28px 24px 22px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .card h2 { font: 800 21px/1.4 inherit; color: var(--ink); margin-bottom: 8px; }
      .card p { font-size: 14px; color: var(--sub); margin-bottom: 22px; }
      .row { display: flex; gap: 10px; }
      .btn {
        flex: 1; min-height: 54px;
        border: 0; border-radius: 14px;
        font: 800 16px/1 inherit; cursor: pointer;
        background: var(--accent); color: var(--accent-ink);
      }
      .btn:active { opacity: 0.8; }
      .btn.ghost { background: transparent; color: var(--sub); border: 1px solid var(--panel-line); }

      .res-label { font: 700 11px/1 inherit; letter-spacing: 0.22em; color: var(--sub); }
      #result-score {
        font: 800 60px/1 ui-rounded, system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em; color: var(--accent);
        margin: 8px 0 4px;
      }
      .badge {
        display: inline-block;
        font: 800 12px/1 inherit; letter-spacing: 0.14em;
        background: var(--accent); color: var(--accent-ink);
        padding: 7px 12px; border-radius: 999px; margin-bottom: 18px;
      }
      .badge[hidden] { display: none; }

      /* ── ランキング表 ── */
      .rank-list { text-align: left; }
      .rank-row {
        display: flex; align-items: baseline; gap: 10px;
        padding: 9px 4px; border-bottom: 1px solid var(--panel-line);
        font-variant-numeric: tabular-nums;
      }
      .rank-row:last-child { border-bottom: 0; }
      .rank-row .no { width: 24px; font: 800 14px/1 inherit; color: var(--sub); }
      .rank-row .v { flex: 1; font: 800 19px/1 inherit; color: var(--ink); }
      .rank-row .d { font: 400 12px/1 inherit; color: var(--sub); }
      .rank-row.me .v, .rank-row.me .no { color: var(--accent); }
      .rank-empty { padding: 16px 4px; color: var(--sub); font-size: 13px; text-align: center; }

      /* ── タイトル画面 ── */
      #screen-title .backdrop {
        background:
          linear-gradient(rgba(18, 10, 4, 0.58), rgba(18, 10, 4, 0.58)),
          url(assets/title-bg.png) center / cover no-repeat;
      }
      .title-screen {
        position: relative;
        width: 100%; max-width: 420px;
        display: flex; flex-direction: column; align-items: center;
        padding: 0 6px;
      }
      .logo { text-align: center; margin-bottom: 32px; }
      .logo .l1 {
        font: 800 44px/1.05 ui-rounded, system-ui, sans-serif;
        letter-spacing: 0.1em; text-indent: 0.1em; color: var(--ink);
      }
      .logo .l2 {
        font: 800 44px/1.05 ui-rounded, system-ui, sans-serif;
        letter-spacing: 0.1em; text-indent: 0.1em; color: var(--accent);
      }
      .logo .rule {
        width: 76%; height: 1px; margin: 16px auto 11px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0.75;
      }
      .logo .sub { font: 600 12px/1 inherit; letter-spacing: 0.34em; text-indent: 0.34em; color: var(--sub); }
      .play-btn {
        width: 100%; min-height: 66px;
        border: 0; border-radius: 18px;
        background: var(--accent); color: var(--accent-ink);
        font: 800 21px/1 inherit; letter-spacing: 0.08em; cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      .play-btn:active { opacity: 0.85; }
      .hs-panel {
        width: 100%; margin-top: 26px;
        background: rgba(20, 12, 6, 0.5);
        border: 1px solid var(--panel-line); border-radius: 18px;
        padding: 16px 18px; cursor: pointer;
      }
      .hs-panel .t {
        display: flex; align-items: baseline; justify-content: space-between;
        font: 700 11px/1 inherit; letter-spacing: 0.22em; color: var(--sub); margin-bottom: 6px;
      }
      .hs-panel .more { font: 700 12px/1 inherit; letter-spacing: 0; color: var(--accent); }
      .total-line {
        width: 100%; margin-top: 12px;
        display: flex; align-items: center; gap: 10px;
        background: transparent; border: 0; cursor: pointer;
        color: var(--sub); font: 700 12px/1 inherit; letter-spacing: 0.14em;
        padding: 8px 6px;
      }
      .total-line .tl-val {
        color: var(--ink); font-size: 15px; letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }
      .total-line .tl-rank { margin-left: auto; color: var(--accent); letter-spacing: 0.06em; }
      .total-line:active { opacity: 0.7; }

      /* リザルトの添えトータル1行 */
      .result-total {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        margin: 16px 0 2px; font: 700 12px/1 inherit; letter-spacing: 0.1em; color: var(--sub);
      }
      .result-total .rt-val { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
      .result-total .rt-rank { color: var(--accent); }

      .title-foot { margin-top: 22px; }
      .title-foot button {
        font: 700 13px/1 inherit; letter-spacing: 0.06em; color: var(--sub);
        border: 1px solid var(--panel-line); border-radius: 999px;
        padding: 11px 20px; background: transparent; cursor: pointer;
      }

      /* ── ハイスコア一覧 ── */
      #screen-scores { padding: 0; }
      #screen-scores .backdrop { background: rgba(12, 7, 3, 0.9); }
      .sheet {
        position: relative;
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        padding: calc(20px + env(safe-area-inset-top, 0)) 22px calc(24px + env(safe-area-inset-bottom, 0));
        max-width: 520px; margin: 0 auto;
      }
      .sheet .head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      .sheet .head .back {
        width: 44px; height: 44px; border-radius: 50%;
        border: 1px solid var(--panel-line);
        background: rgba(20, 12, 6, 0.6); color: var(--ink);
        font: 800 20px/1 inherit; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .sheet .head h2 { font: 800 19px/1 inherit; letter-spacing: 0.12em; color: var(--ink); }
      .sheet .body {
        flex: 1; overflow: auto;
        background: rgba(20, 12, 6, 0.55);
        border: 1px solid var(--panel-line); border-radius: 18px;
        padding: 6px 18px;
      }
    </style>
  </head>
  <body>
    <!-- 盤面（canvas はここに挿入される） -->
    <div id="stage"></div>

    <!-- プレイ中のHUD -->
    <div id="hud">
      <div class="score-wrap">
        <div class="score-label" id="score-label">SCORE</div>
        <div id="score">0</div>
        <div id="hint">画面をタップすると始まるよ</div>
      </div>
      <div class="icon-col">
        <button id="speed" class="icon-btn hot">1×</button>
        <button id="restart" class="icon-btn" aria-label="やり直す">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" />
          </svg>
        </button>
      </div>
    </div>

    <!-- デバッグ表示（URLに ?debug=1 を付けた時だけ出る） -->
    <div id="debug" hidden></div>

    <!-- タイトル画面 -->
    <div class="screen" id="screen-title" hidden>
      <div class="backdrop"></div>
      <div class="title-screen">
        <div class="logo">
          <div class="l1">MARBLE</div>
          <div class="l2">MILL</div>
          <div class="rule"></div>
          <div class="sub">REIA EDITION</div>
        </div>
        <button class="play-btn" id="title-play">PLAY</button>
        <div class="hs-panel" id="title-scores">
          <div class="t">HIGH SCORE<span class="more">すべて見る ›</span></div>
          <div class="rank-list" id="title-hs-list"></div>
        </div>
        <button class="total-line" id="title-total">
          <span class="tl-label">TOTAL</span>
          <span class="tl-val" id="title-total-val">0</span>
          <span class="tl-rank" id="title-total-rank">世界 #—</span>
        </button>
        <div class="title-foot">
          <button id="title-editor">ステージエディタ</button>
        </div>
      </div>
    </div>

    <!-- リザルト -->
    <div class="screen" id="screen-result" hidden>
      <div class="backdrop"></div>
      <div class="card">
        <div class="res-label">SCORE</div>
        <div id="result-score">0</div>
        <div class="badge" id="result-badge" hidden>NEW RECORD</div>
        <div class="rank-list" id="result-list"></div>
        <div class="result-total">
          <span>TOTAL</span>
          <span class="rt-val" id="result-total-val">0</span>
          <span class="rt-rank" id="result-total-rank">世界 #—</span>
        </div>
        <div class="row" style="margin-top: 16px">
          <button class="btn ghost" id="result-title">タイトルへ</button>
          <button class="btn" id="result-retry">もう一回</button>
        </div>
      </div>
    </div>

    <!-- トータルランキング（疑似・ローカル） -->
    <div class="screen" id="screen-total" hidden>
      <div class="backdrop"></div>
      <div class="sheet">
        <div class="head">
          <button class="back" id="total-back" aria-label="戻る">‹</button>
          <h2>TOTAL RANKING</h2>
        </div>
        <div class="body"><div class="rank-list" id="total-list"></div></div>
      </div>
    </div>

    <!-- ハイスコア一覧 -->
    <div class="screen" id="screen-scores" hidden>
      <div class="backdrop"></div>
      <div class="sheet">
        <div class="head">
          <button class="back" id="scores-back" aria-label="戻る">‹</button>
          <h2>HIGH SCORE</h2>
        </div>
        <div class="body"><div class="rank-list" id="scores-list"></div></div>
      </div>
    </div>

    <!-- 確認ダイアログ -->
    <div class="screen" id="dialog" hidden>
      <div class="backdrop"></div>
      <div class="card">
        <h2 class="d-title"></h2>
        <p class="d-body"></p>
        <div class="row">
          <button class="btn ghost d-cancel">つづける</button>
          <button class="btn d-ok">やり直す</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
