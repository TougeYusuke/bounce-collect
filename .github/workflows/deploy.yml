name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # ⚠️ GitHub Pages は `<user>.github.io/bounce-collect/` の下に出るので、
      #    起点をリポジトリ名に合わせる（ここがズレると JS/CSS が 404）。
      #    本番は Vercel（ルート直下＝既定の `/`）へ移した（2026-07-26）。
      - run: npm run build
        env:
          VITE_BASE: /marble-mill/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
