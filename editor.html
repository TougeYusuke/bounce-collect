<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Marble Mill — ステージエディタ</title>
    <style>
      :root {
        --ink: #fdf6ec;
        --sub: #c0ac93;
        --accent: #e6b862;
        --accent-ink: #2e1e05;
        --panel: #1d1610;
        --line: rgba(255, 238, 214, 0.14);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #120c07;
        color: var(--ink);
        font: 14px/1.6 "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
        display: flex;
        overflow: hidden;
      }

      /* 盤面 */
      #board { flex: 1; position: relative; min-width: 0; }
      #board canvas { cursor: crosshair; }

      /* 右パネル */
      #side {
        width: 300px;
        flex: none;
        border-left: 1px solid var(--line);
        background: var(--panel);
        padding: 18px 16px;
        overflow: auto;
      }
      h1 { font: 800 15px/1.4 inherit; letter-spacing: 0.08em; margin-bottom: 4px; }
      .hint { font-size: 12px; color: var(--sub); margin-bottom: 16px; }
      .group { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
      .group > .t {
        font: 700 11px/1 inherit; letter-spacing: 0.2em; color: var(--sub); margin-bottom: 10px;
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        flex: 1; min-width: 84px; min-height: 40px;
        border: 1px solid var(--line); border-radius: 10px;
        background: #2a2016; color: var(--ink);
        font: 700 13px/1 inherit; cursor: pointer;
      }
      button:hover { background: #362818; }
      button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
      button.danger { color: #ff9d8a; }
      button:disabled { opacity: 0.35; cursor: default; }
      button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

      .field { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .field label { width: 62px; font-size: 12px; color: var(--sub); }
      .field input {
        flex: 1; min-width: 0; padding: 8px 10px;
        border: 1px solid var(--line); border-radius: 8px;
        background: #120c07; color: var(--ink); font: 13px inherit;
      }
      #sel-none { font-size: 12px; color: var(--sub); }
      #status { margin-top: 12px; font-size: 12px; color: var(--accent); min-height: 1.6em; }
    </style>
  </head>
  <body>
    <div id="board"></div>

    <aside id="side">
      <h1>ステージエディタ</h1>
      <div class="hint">
        バーをドラッグで移動／端をつかむと長さ変更。5px刻みで吸着します。
      </div>

      <div class="group">
        <div class="t">ステージ</div>
        <div class="field">
          <label for="name">名前</label>
          <input id="name" value="default" />
        </div>
        <div class="row">
          <button id="save" class="primary">保存</button>
          <button id="reset">読み直す</button>
        </div>
        <div id="status"></div>
      </div>

      <div class="group">
        <div class="t">追加</div>
        <div class="row">
          <button id="add-gate">ゲート追加</button>
          <button id="add-jumper">ジャンプ台追加</button>
        </div>
      </div>

      <div class="group">
        <div class="t">選択中</div>
        <div id="sel-none">盤面のバーをクリックしてね</div>
        <div id="sel-panel" hidden>
          <div class="field">
            <label>種類</label>
            <span id="sel-kind"></span>
          </div>
          <div class="field">
            <label for="f-y">上下</label>
            <input id="f-y" type="number" step="5" />
          </div>
          <div class="field">
            <label for="f-x1">左端</label>
            <input id="f-x1" type="number" step="5" />
          </div>
          <div class="field">
            <label for="f-x2">右端</label>
            <input id="f-x2" type="number" step="5" />
          </div>
          <div id="mult-row">
            <div class="t" style="margin: 12px 0 8px">倍率</div>
            <div class="row" id="mults"></div>
          </div>
          <div class="row" style="margin-top: 12px">
            <button id="del" class="danger">削除</button>
          </div>
        </div>
      </div>

      <div class="group">
        <div class="t">試し撃ち</div>
        <div class="row">
          <button id="play">試遊する</button>
        </div>
        <div class="hint" style="margin: 10px 0 0">
          いまの配置でR1を回します。もう一度押すと編集に戻ります。
        </div>
      </div>
    </aside>

    <script type="module" src="/src/editor/editorMain.ts"></script>
  </body>
</html>
